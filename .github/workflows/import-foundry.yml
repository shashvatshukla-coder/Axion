name: Import Foundry Club

on:
  push:
    paths:
      - '.github/workflows/import-foundry.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand Foundry Club source
        shell: bash
        run: |
          set -euo pipefail
          cat .axion-import/xz* > /tmp/foundry.b64
          test "$(wc -c < /tmp/foundry.b64)" -eq 83504
          base64 -d /tmp/foundry.b64 > /tmp/foundry.tar.xz
          test "$(wc -c < /tmp/foundry.tar.xz)" -eq 62628
          echo "2cbcdf9a0aee33bdb71f40288a7293045da42eacf597fc737d011d3f648eaba0  /tmp/foundry.tar.xz" | sha256sum -c -
          mkdir -p /tmp/foundry
          tar -xJf /tmp/foundry.tar.xz -C /tmp/foundry
          cp -a /tmp/foundry/. .
          rm -rf .axion-import .bootstrap .github/workflows/import-foundry.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import Foundry Club codebase"
          git push origin main
