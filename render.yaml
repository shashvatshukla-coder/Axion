services:
  - type: web
    name: foundry-club
    runtime: node
    buildCommand: npm ci --include=dev && npm run build && npm run typecheck:api
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: APP_ORIGIN
        sync: false
